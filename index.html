<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dictation</title>
    <!-- Tailwind CSS Engine for dynamic iPad layouts -->
    <!--script src="https://tailwindcss.com"></script-->
    <script src="https://cdn.tailwindcss.com"></script>
    <!--link rel="stylesheet" href="https://cloudflare.com"-->
    <!--link rel="stylesheet" href="https://cdnjs.cloudflare.com"-->
    <!--script src="https://cloudflare.com"></script-->
    <style>
        html, body {
            height: 100%;
            height: 100dvh;
        }
        body {
            background-color: #f3f4f6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: -webkit-fill-available;
        }
        .tab-btn-active {
            color: #2563eb;
            background-color: #eff6ff;
        }
    </style>
</head>
<body class="h-full min-h-0 flex flex-col overflow-hidden">

    <header class="shrink-0 bg-white border-b border-gray-200 px-4 py-3 flex items-center justify-between">
        <h1 class="text-lg font-bold text-gray-800">Dictation</h1>
        <div id="status-bar" class="text-xs font-semibold text-gray-500 truncate max-w-[55%] text-right">Loading...</div>
    </header>

    <main class="flex-1 flex flex-col min-h-0 overflow-hidden">

        <!-- PLAYER TAB (default) -->
        <section id="panel-player" class="flex-1 flex flex-col min-h-0 overflow-y-auto bg-gray-100 p-4">

            <div class="flex justify-center items-center gap-3 mb-3 shrink-0">
                <button id="dictation-toggle-btn" onclick="toggleDictationMode()" class="flex items-center text-xs font-bold text-gray-500 bg-white border border-gray-300 px-4 py-2 rounded-xl shadow-sm hover:bg-gray-50 transition">
                    <span>✍ Dictation Mode: OFF</span>
                </button>
                <button id="shuffle-toggle-btn" onclick="toggleShuffleMode()" class="flex items-center text-xs font-bold text-gray-500 bg-white border border-gray-300 px-4 py-2 rounded-xl shadow-sm hover:bg-gray-50 transition">
                    <span>🔀 Shuffle: OFF</span>
                </button>
            </div>

            <div class="flex-1 flex flex-col justify-center items-center space-y-4 min-h-0">

                <div class="relative w-full bg-white rounded-2xl shadow-md p-5 min-h-[200px] flex flex-col justify-between border border-gray-200">
                    <button
                        id="amend-text-btn"
                        onclick="openAmendModal()"
                        title="Amend current text"
                        class="absolute top-3 right-3 w-6 h-6 flex items-center justify-center rounded-full bg-gray-50 hover:bg-gray-100 text-gray-400 hover:text-gray-600 text-xs border border-gray-200 shadow-sm transition-colors duration-200 focus:outline-none focus:ring-1 focus:ring-blue-400">
                        ✏️
                    </button>

                    <div id="playback-index-counter" class="text-center text-xs font-bold tracking-widest text-gray-400 uppercase">Item 0 of 0</div>
                    <div id="playback-screen-text" class="text-center text-2xl font-semibold text-gray-800 leading-relaxed my-auto px-4">
                        Select a list from Library to begin.
                    </div>
                    <div id="playback-lang-indicator" class="text-center text-xs font-semibold text-gray-400">Voice Engine: None</div>
                </div>

                <dialog id="amend-dialog" class="backdrop:bg-black/30 rounded-xl p-6 shadow-xl border border-gray-200 w-full max-w-md bg-white">
                    <div class="flex flex-col space-y-4">
                        <h3 class="text-base font-bold text-gray-700">Amend Text Content</h3>
                        <textarea id="amend-text-input" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-blue-500 resize-none text-gray-700"></textarea>
                        <div class="flex justify-end space-x-2">
                            <button onclick="closeAmendModal()" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-600 font-medium rounded-lg text-xs transition-colors">Cancel</button>
                            <button onclick="commitAmendText()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg text-xs transition-colors shadow-sm">Amend</button>
                        </div>
                    </div>
                </dialog>

                <div class="w-full relative bg-white border border-gray-200 rounded-xl p-4 shadow-sm flex flex-col space-y-1.5">
                    <button
                        onclick="debugVoices()"
                        title="Debug Available Voices"
                        class="absolute top-3 right-3 w-5 h-5 flex items-center justify-center rounded-full bg-gray-50 hover:bg-gray-100 text-gray-400 hover:text-gray-600 text-[10px] font-bold border border-gray-200 shadow-sm transition-colors duration-200 focus:outline-none focus:ring-1 focus:ring-blue-400">
                        ?
                    </button>

                    <label class="text-xs font-bold text-gray-400 uppercase tracking-wider">🎧 Voice</label>
                    <select id="hardware-voice-dropdown" onchange="userSelectedVoiceOverride()" class="w-full text-sm font-medium bg-gray-50 border border-gray-300 rounded-lg px-2.5 py-2 text-gray-700 focus:outline-blue-500">
                        <option value="">(Loading system voices...)</option>
                    </select>

                    <div class="mt-2 pt-3 border-t border-gray-100 flex flex-col space-y-1.5">
                        <div class="flex justify-between items-center">
                            <label class="text-xs font-bold text-gray-400 uppercase tracking-wider">⏱️ Speed</label>
                            <span id="speed-label-text" class="text-xs font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded-md">Slow</span>
                        </div>
                        <input
                            id="speech-speed-slider"
                            type="range"
                            min="1"
                            max="4"
                            value="2"
                            step="1"
                            oninput="updateSpeechSpeedDisplay()"
                            class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-blue-600 focus:outline-none">
                        <div class="flex justify-between text-[10px] font-medium text-gray-400 px-1">
                            <span>Very Slow</span>
                            <span>Slow</span>
                            <span>Normal</span>
                            <span>Fast</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="w-full max-w-md mx-auto bg-white rounded-full shadow-lg border border-gray-200 p-3 flex items-center justify-around shrink-0 mt-3 pb-2">
                <button onclick="goToPreviousItem()" class="flex flex-col items-center group">
                    <div class="w-11 h-11 rounded-full bg-orange-100 group-hover:bg-orange-200 flex items-center justify-center text-orange-600 text-lg transition">⏮</div>
                    <span class="text-[10px] font-bold text-gray-500 mt-1 uppercase">Prev</span>
                </button>
                <button onclick="speakCurrentItem()" class="flex flex-col items-center group">
                    <div class="w-14 h-14 rounded-full bg-blue-600 group-hover:bg-blue-700 flex items-center justify-center text-white text-2xl shadow-md transition">▶</div>
                    <span class="text-[10px] font-bold text-gray-500 mt-1 uppercase">Play</span>
                </button>
                <button onclick="goToNextItem()" class="flex flex-col items-center group">
                    <div class="w-11 h-11 rounded-full bg-green-100 group-hover:bg-green-200 flex items-center justify-center text-green-600 text-lg transition">⏭</div>
                    <span class="text-[10px] font-bold text-gray-500 mt-1 uppercase">Next</span>
                </button>
            </div>
        </section>

        <!-- LIBRARY TAB -->
        <section id="panel-library" class="hidden flex-1 flex flex-col min-h-0 overflow-y-auto bg-white p-4 space-y-6">
            <div class="space-y-2">
                <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider">Create Group</h2>
                <div class="flex space-x-2">
                    <input type="text" id="group-name-input" placeholder="New Group Name" class="flex-1 px-3 py-1.5 border border-gray-300 rounded-lg text-sm focus:outline-blue-500">
                    <button onclick="createNewGroup()" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-lg text-sm font-medium">+</button>
                </div>
            </div>
            <div class="flex-1 space-y-4">
                <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider">Your Groups</h2>
                <div id="groups-list-container" class="space-y-4"></div>
            </div>
        </section>

        <!-- ADD TEXT TAB -->
        <section id="panel-add" class="hidden flex-1 flex flex-col min-h-0 overflow-y-auto bg-gray-50 p-4 space-y-4">
            <h2 class="text-lg font-bold text-gray-700">Add Text</h2>

            <div class="space-y-1">
                <label class="text-xs font-bold text-gray-500">List Name</label>
                <input type="text" id="list-name-input" placeholder="e.g., UK English Vocabulary" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-blue-500">
            </div>

            <div class="space-y-1">
                <label class="text-xs font-bold text-gray-500">Text</label>
                <textarea id="text-blob-input" rows="6" placeholder="Paste your text here..." class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-blue-500 resize-none"></textarea>
            </div>

            <div class="space-y-1">
                <label class="text-xs font-bold text-gray-500">Language</label>
                <div class="grid grid-cols-2 gap-2">
                    <button id="lang-chinese" onclick="setLanguageOption('zh')" class="py-2 rounded-lg text-sm font-medium bg-blue-600 text-white border border-blue-600">中文</button>
                    <button id="lang-english" onclick="setLanguageOption('en')" class="py-2 rounded-lg text-sm font-medium bg-white text-gray-600 border border-gray-300 hover:bg-gray-100">English</button>
                </div>
            </div>

            <div class="space-y-1">
                <label class="text-xs font-bold text-gray-500">Split By</label>
                <div class="grid grid-cols-2 gap-2">
                    <button id="strategy-sentence" onclick="setStrategy(true)" class="py-2 rounded-lg text-sm font-medium bg-blue-600 text-white border border-blue-600">Sentences</button>
                    <button id="strategy-word" onclick="setStrategy(false)" class="py-2 rounded-lg text-sm font-medium bg-white text-gray-600 border border-gray-300 hover:bg-gray-100">Words</button>
                </div>
            </div>

            <div class="space-y-1">
                <label class="text-xs font-bold text-gray-500">Save to Group</label>
                <select id="group-target-select" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm bg-white focus:outline-blue-500">
                    <option value="">Select a Group...</option>
                </select>
            </div>

            <button onclick="processAndSaveToIndexedDB()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg text-sm transition-colors shadow">
                Save List
            </button>
        </section>

        <!-- BOTTOM TAB BAR -->
        <nav class="shrink-0 bg-white border-t border-gray-200 flex items-stretch pb-[env(safe-area-inset-bottom)]">
            <button id="tab-player" onclick="switchTab('player')" class="tab-btn-active flex-1 flex flex-col items-center py-2.5 text-xs font-semibold text-gray-500 transition">
                <span class="text-lg leading-none mb-0.5">▶</span>
                Player
            </button>
            <button id="tab-library" onclick="switchTab('library')" class="flex-1 flex flex-col items-center py-2.5 text-xs font-semibold text-gray-500 transition">
                <span class="text-lg leading-none mb-0.5">📚</span>
                Library
            </button>
            <button id="tab-add" onclick="switchTab('add')" class="flex-1 flex flex-col items-center py-2.5 text-xs font-semibold text-gray-500 transition">
                <span class="text-lg leading-none mb-0.5">＋</span>
                Add Text
            </button>
        </nav>
    </main>

    <!-- CORE APPLICATION DATABASE & AUDIO ENGINE LOGIC -->
    <script>
        let db;
        let dbState = [];
        let activeList = null;
        let activePlaybackArray = [];
        let playbackIndex = 0;
        let splitBySentenceStrategy = true;
        let selectedLanguage = 'zh'; 
        let isShuffleEnabled = false;
        let isDictationEnabled = false;
        
        let allSystemVoices = [];
        let chosenVoiceMapping = { 'zh': null, 'en': null };

        const compactBtnOff = "flex items-center text-xs font-bold text-gray-500 bg-white border border-gray-300 px-4 py-2 rounded-xl shadow-sm hover:bg-gray-50 transition";
        const compactBtnShuffleOn = "flex items-center text-xs font-bold text-white bg-blue-600 border border-blue-600 px-4 py-2 rounded-xl shadow-sm hover:bg-blue-700 transition";
        const compactBtnDictationOn = "flex items-center text-xs font-bold text-white bg-red-600 border border-red-600 px-4 py-2 rounded-xl shadow-sm hover:bg-red-700 transition";

        function switchTab(tab) {
            ['player', 'library', 'add'].forEach(t => {
                document.getElementById('panel-' + t).classList.toggle('hidden', t !== tab);
                const btn = document.getElementById('tab-' + t);
                btn.classList.toggle('tab-btn-active', t === tab);
            });
        }

        // Detect if the device is an iPhone (iOS) or an iPad (iPadOS)
        const isAppleMobileDevice = () => {
            const userAgent = navigator.userAgent || navigator.vendor || window.opera;
            const isIOS = /iPad|iPhone|iPod/.test(userAgent) && !window.MSStream;
            // Modern iPads pretend to be MacBooks, so we check for Mac + multi-touch capabilities
            const isiPadOS = (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            
            return isIOS || isiPadOS;
        };

        // Global speed configuration mapping
        const speedMap = isAppleMobileDevice() 
        ? {
            // Slower profiles tuned specifically to compensate for fast iPadOS system engines
            1: { label: "Very Slow", rate: 0.4 },
            2: { label: "Slow",      rate: 0.6 },
            3: { label: "Normal",    rate: 0.8 }, // Drops native 1.0 down to a calmer 0.8 pace
            4: { label: "Fast",      rate: 1.1 }
          }
        : {
            // Standard profiles for Desktop Chrome, macOS, and Windows
            1: { label: "Very Slow", rate: 0.6 },
            2: { label: "Slow",      rate: 0.8 },
            3: { label: "Normal",    rate: 1.0 },
            4: { label: "Fast",      rate: 1.4 }
          };

        // Punctuation maps
        const punctuationAudioMap = {
            'zh': {
                '.': ', 句號, ', '。': ', 句號, ', '?': ', 問號, ', '？': ', 問號, ', '!': ', 感嘆號, ', '！': ', 感嘆號, ',
                ',': ', 逗號, ', '，': ', 逗號, ', '、': ', 頓號, ', ':': ', 冒號, ', '：': ', 冒號, ', 
                '－': ', 破折號, ', '——': ', 破折號, ', '-': ', 破折號, ',
                '“': ', 開引號, ', '”': ', 關引號, ', '「': ', 開引號, ', '」': ', 關引號, '
            },
            'en': {
                '.': ', Full Stop, ', '。': ', Full Stop, ', '?': ', Question Mark, ', '？': ', Question Mark, ', '!': ', Exclamation Mark, ', '！': ', Exclamation Mark, ',
                ',': ', Comma, ', '，': ', Comma, ', '、': ', Comma, ', ':': ', Colon, ', '：': ', Colon',
                '-': ', Hyphen, ', 
                '"': ', Quotation Mark, ', "'": ', Quotation Mark, ', '“': ', Open Quotation Mark, ', '”': ', Close Quotation Mark, '
            }
        };

        // 1. SAFE DATABASE SCHEMA INITIALIZATION (EXECUTES IMMEDIATELY)
        const request = indexedDB.open("LanguageReaderLocalDatabase", 1);
        
        request.onupgradeneeded = (e) => {
            db = e.target.result;
            if (!db.objectStoreNames.contains("groups")) {
                db.createObjectStore("groups", { keyPath: "id", autoIncrement: true });
            }
            if (!db.objectStoreNames.contains("lists")) {
                db.createObjectStore("lists", { keyPath: "id", autoIncrement: true });
            }
        };

        request.onsuccess = (e) => { 
            db = e.target.result; 
            // Load database content instantly without blocking on anything else
            fetchDatabaseSchema(); 
            // Separately initialize audio hardware stream
            loadSystemVoiceHardwareProfiles(); 
        };

        request.onerror = (e) => {
            console.error("Database failed to open:", e.target.error);
            document.getElementById("status-bar").textContent = "Database Error! Please try refreshing.";
        };

        // 2. HARDWARE SYSTEM VOICE MANAGEMENT (ISOLATED TIMING ARCHITECTURE)
        function loadSystemVoiceHardwareProfiles() {
            if (typeof speechSynthesis === 'undefined') return;
            
            allSystemVoices = window.speechSynthesis.getVoices();
            const dropdown = document.getElementById("hardware-voice-dropdown");
            
            // Filter down to valid target languages
            //const validVoices = allSystemVoices.filter(v => v.lang === 'zh-HK' || v.lang === 'en-GB');
            const validVoices = allSystemVoices.filter(v => v.lang === 'zh-HK' || v.lang === 'en-GB' 
                                                            || v.lang === 'yue-HK'
                                                            );

            if (validVoices.length === 0) {
                dropdown.innerHTML = `<option value="">Default System Voice</option>`;
                return;
            }

            dropdown.innerHTML = "";
            const zhGroup = document.createElement("optgroup"); zhGroup.label = "Cantonese Voices (zh-HK/yue-HK)";
            const enGroup = document.createElement("optgroup"); enGroup.label = "British Voices (en-GB)";

            validVoices.forEach(voice => {
                const opt = document.createElement("option");
                opt.value = voice.name;
                let label = voice.name;
                if (voice.name.toLowerCase().includes('enhanced')) label += " (High Quality/Neural)";
                if (voice.name.toLowerCase().includes('premium')) label += " (Premium HD)";
                opt.textContent = label;

                //if (voice.lang === 'zh-HK') zhGroup.appendChild(opt);
                if (voice.lang === 'zh-HK' || voice.lang === 'yue-HK') zhGroup.appendChild(opt);
                if (voice.lang === 'en-GB') enGroup.appendChild(opt);
            });

            if (zhGroup.children.length > 0) dropdown.appendChild(zhGroup);
            if (enGroup.children.length > 0) dropdown.appendChild(enGroup);

            // Restore voice selection from localStorage safely
            const savedZhVoice = localStorage.getItem("last_selected_voice_zh");
            const savedEnVoice = localStorage.getItem("last_selected_voice_en");

            chosenVoiceMapping['zh'] = allSystemVoices.find(v => v.name === savedZhVoice) || 
                                       allSystemVoices.find(v => v.lang === 'yue-HK' && v.name.toLowerCase().includes('enhanced')) ||
                                       allSystemVoices.find(v => v.lang === 'yue-HK')
                                       allSystemVoices.find(v => v.lang === 'zh-HK' && v.name.toLowerCase().includes('enhanced')) ||
                                       allSystemVoices.find(v => v.lang === 'zh-HK') || null;

            chosenVoiceMapping['en'] = allSystemVoices.find(v => v.name === savedEnVoice) || 
                                       allSystemVoices.find(v => v.lang === 'en-GB' && v.name.toLowerCase().includes('enhanced')) ||
                                       allSystemVoices.find(v => v.lang === 'en-GB') || null;

            syncDropdownUIWithActiveProfile();
        }

        function syncDropdownUIWithActiveProfile() {
            const dropdown = document.getElementById("hardware-voice-dropdown");
            if (!dropdown) return;
            
            const currentLang = activeList ? activeList.lang : selectedLanguage;
            const activeProfile = chosenVoiceMapping[currentLang];
            if (activeProfile) dropdown.value = activeProfile.name;
        }

        function userSelectedVoiceOverride() {
            const dropdown = document.getElementById("hardware-voice-dropdown");
            const selectedName = dropdown.value;
            const foundVoice = allSystemVoices.find(v => v.name === selectedName);
            
            if (foundVoice) {
                if (foundVoice.lang === 'zh-HK') {
                    chosenVoiceMapping['zh'] = foundVoice;
                    localStorage.setItem("last_selected_voice_zh", foundVoice.name);
                } else if (foundVoice.lang === 'en-GB') {
                    chosenVoiceMapping['en'] = foundVoice;
                    localStorage.setItem("last_selected_voice_en", foundVoice.name);
                }
                if (activeList) speakCurrentItem(); 
            }
        }

        // Hook Safari voice refresh safely
        if (typeof speechSynthesis !== 'undefined' && speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = loadSystemVoiceHardwareProfiles;
        }

        // 3. FORM INTERACTION HANDLERS
        function setLanguageOption(lang) {
            selectedLanguage = lang;
            document.getElementById('lang-chinese').className = lang === 'zh' ? "py-2 rounded-lg text-sm font-medium bg-blue-600 text-white border border-blue-600" : "py-2 rounded-lg text-sm font-medium bg-white text-gray-600 border border-gray-300 hover:bg-gray-100";
            document.getElementById('lang-english').className = lang === 'en' ? "py-2 rounded-lg text-sm font-medium bg-blue-600 text-white border border-blue-600" : "py-2 rounded-lg text-sm font-medium bg-white text-gray-600 border border-gray-300 hover:bg-gray-100";
            syncDropdownUIWithActiveProfile();
        }

        function setStrategy(isSentence) {
            splitBySentenceStrategy = isSentence;
            document.getElementById('strategy-sentence').className = isSentence ? "py-2 rounded-lg text-sm font-medium bg-blue-600 text-white border border-blue-600" : "py-2 rounded-lg text-sm font-medium bg-white text-gray-600 border border-gray-300 hover:bg-gray-100";
            document.getElementById('strategy-word').className = !isSentence ? "py-2 rounded-lg text-sm font-medium bg-blue-600 text-white border border-blue-600" : "py-2 rounded-lg text-sm font-medium bg-white text-gray-600 border border-gray-300 hover:bg-gray-100";
        }

        // 4. TEXT PARSING SEGMENTATION ENGINE MATRIX
        function executeTokenSplitRules(text, parseBySentences, lang) {
            if (parseBySentences) {
                const tokens = text.split(/([.!?。！？,，、\n\r：:]+)/);
                const items = [];
                for (let i = 0; i < tokens.length; i += 2) {
                    let sentence = tokens[i] ? tokens[i].trim() : "";
                    let punc = tokens[i+1] ? tokens[i+1].trim() : "";
                    let compiledPhrase = (sentence + punc).trim();
                    if (compiledPhrase.length === 0) continue;

                    let nextTokenIndex = i + 2;
                    if (nextTokenIndex < tokens.length && tokens[nextTokenIndex]) {
                        let nextTextChunk = tokens[nextTokenIndex].trim();
                        let matchQuote = nextTextChunk.match(/^([”」"]+)/);
                        if (matchQuote) {
                            compiledPhrase += matchQuote[1];
                            tokens[nextTokenIndex] = tokens[nextTokenIndex].replace(/^([”」"]+)/, "");
                        }
                    }
                    if (compiledPhrase.length > 0) items.push(compiledPhrase);
                }
                return items;
            } else {
                if (lang === 'zh') {
                    return text.split(/[\s\n\r]+/).map(s => s.trim()).filter(s => s.length > 0);
                } else {
                    return text.split(/[\n\r]+/).map(s => s.trim()).filter(s => s.length > 0);
                }
            }
        }

        // 5. DATA LOADING & SAVE PIPELINE
        function fetchDatabaseSchema() {
            if (!db) return;
            
            try {
                const transaction = db.transaction(["groups", "lists"], "readonly");
                const groupStore = transaction.objectStore("groups");
                const listStore = transaction.objectStore("lists");

                let fetchedGroups = [];
                let fetchedLists = [];

                groupStore.openCursor().onsuccess = (e) => {
                    let cursor = e.target.result;
                    if (cursor) { fetchedGroups.push(cursor.value); cursor.continue(); }
                };

                listStore.openCursor().onsuccess = (e) => {
                    let cursor = e.target.result;
                    if (cursor) { fetchedLists.push(cursor.value); cursor.continue(); }
                };

                transaction.oncomplete = () => {
                    dbState = fetchedGroups.map(g => ({ ...g, subLists: fetchedLists.filter(l => l.groupId === g.id) }));
                    renderSidebarDOMComponents();
                    document.getElementById("status-bar").textContent = activeList ? `Currently Viewing: ${activeList.name}` : "Select or create a list to begin";
                };
            } catch (err) {
                console.error("Failed to fetch database data securely:", err);
            }
        }

        function createNewGroup() {
            const name = document.getElementById("group-name-input").value.trim();
            if (!name || !db) return;
            
            const tx = db.transaction(["groups"], "readwrite");
            tx.objectStore("groups").add({ name: name });
            tx.oncomplete = () => { 
                document.getElementById("group-name-input").value = ""; 
                fetchDatabaseSchema(); 
            };
        }

        function processAndSaveToIndexedDB() {
            const name = document.getElementById("list-name-input").value.trim();
            const text = document.getElementById("text-blob-input").value.trim();
            const selectValue = document.getElementById("group-target-select").value;

            if (!name || !text || !selectValue || !db) return alert("Please fill out list title, text, and select a target folder group.");
            const groupId = parseInt(selectValue);

            const itemsArray = executeTokenSplitRules(text, splitBySentenceStrategy, selectedLanguage);

            const tx = db.transaction(["lists"], "readwrite");
            tx.objectStore("lists").add({ groupId: groupId, name: name, items: itemsArray, lang: selectedLanguage, shuffleEnabled: false });
            tx.oncomplete = () => {
                document.getElementById("list-name-input").value = "";
                document.getElementById("text-blob-input").value = "";
                fetchDatabaseSchema();
            };
        }

        function deleteListFromDB(id, event) {
            event.stopPropagation();
            if (!db) return;
            
            const tx = db.transaction(["lists"], "readwrite");
            tx.objectStore("lists").delete(id);
            tx.oncomplete = () => { 
                if (activeList && activeList.id === id) resetPlayerUI(); 
                fetchDatabaseSchema(); 
            };
        }

        // 6. AUDIO REPLAY CONTROL MECHANICS
        function selectActiveList(listId) {
            const tx = db.transaction(["lists"], "readonly");
            tx.objectStore("lists").get(listId).onsuccess = (e) => {
                activeList = e.target.result;
                playbackIndex = 0;
                isShuffleEnabled = activeList.shuffleEnabled ?? false;
                syncShuffleButtonUI();
                syncDropdownUIWithActiveProfile();
                initializeTrackSequencer();
                switchTab('player');
            };
        }

        function initializeTrackSequencer() {
            if (!activeList || activeList.items.length === 0) return;
            
            if (isShuffleEnabled) {
                activePlaybackArray = [...activeList.items].sort(() => Math.random() - 0.5);
            } else {
                activePlaybackArray = [...activeList.items];
            }
            updatePlayerScreenHUD();
            speakCurrentItem();
        }

        function syncShuffleButtonUI() {
            const btn = document.getElementById("shuffle-toggle-btn");
            if (isShuffleEnabled) {
                btn.className = compactBtnShuffleOn;
                btn.querySelector("span").textContent = "🔀 Shuffle: ON";
            } else {
                btn.className = compactBtnOff;
                btn.querySelector("span").textContent = "🔀 Shuffle: OFF";
            }
        }

        function toggleShuffleMode() {
            if (!activeList || !db) return;

            isShuffleEnabled = !isShuffleEnabled;
            activeList.shuffleEnabled = isShuffleEnabled;
            syncShuffleButtonUI();

            const tx = db.transaction(["lists"], "readwrite");
            tx.objectStore("lists").put(activeList);
            tx.oncomplete = () => initializeTrackSequencer();
        }

        function toggleDictationMode() {
            isDictationEnabled = !isDictationEnabled;

            const btn = document.getElementById("dictation-toggle-btn");
            if (isDictationEnabled) {
                btn.className = compactBtnDictationOn;
                btn.querySelector("span").textContent = "✍ Dictation Mode: ON";
            } else {
                btn.className = compactBtnOff;
                btn.querySelector("span").textContent = "✍ Dictation Mode: OFF";
            }
            updatePlayerScreenHUD() 

            const amendButton = document.getElementById('amend-text-btn');
            if (isDictationEnabled) {
                // Hides the button entirely from view
                amendButton.classList.add('hidden');
            } else {
                // Shows the button again when dictation mode is turned off
                amendButton.classList.remove('hidden');
            }
        }

        function speakCurrentItem() {
            if (activePlaybackArray.length === 0 || !activeList || typeof speechSynthesis === 'undefined') return;
            
            window.speechSynthesis.cancel(); 

            let rawString = activePlaybackArray[playbackIndex];
            let langMode = activeList.lang; 
            
            let processedSpeakString = "";
            let currentLangMap = punctuationAudioMap[langMode];

            for (let char of rawString) {
                if (currentLangMap && currentLangMap[char]) {
                    processedSpeakString += currentLangMap[char];
                } else {
                    processedSpeakString += char;
                }
            }

            const utterance = new SpeechSynthesisUtterance(processedSpeakString);
            
            // Assign verified user profile choice from dictionary mapping
            const forcedTargetVoice = chosenVoiceMapping[langMode];
            if (forcedTargetVoice) {
                utterance.voice = forcedTargetVoice;
            } else {
                utterance.lang = langMode === 'zh' ? 'zh-HK' : 'en-GB';
            }

            utterance.rate = getSelectedSpeechRate(); //0.5; //0.88; 
            window.speechSynthesis.speak(utterance);
        }

        function goToPreviousItem() {
            if (activePlaybackArray.length === 0) return;
            if (playbackIndex > 0) {
                playbackIndex--;

                updatePlayerScreenHUD();
                speakCurrentItem();
            } else {
                //playbackIndex = activePlaybackArray.length - 1; 
                alert("This is the first item.");
            }
        }

        function goToNextItem() {
            if (activePlaybackArray.length === 0) return;
            if (playbackIndex < activePlaybackArray.length - 1) {
                playbackIndex++;

                updatePlayerScreenHUD();
                speakCurrentItem();
            } else {
                //playbackIndex = 0; 
                alert("This is the last item.");
            }
        }

        // 7. USER INTERFACE GENERATION LOOPS
        function updatePlayerScreenHUD() {
            if (!activeList) return;
            document.getElementById("playback-index-counter").textContent = `Item ${playbackIndex + 1} of ${activePlaybackArray.length}`;
            
            const screenText = document.getElementById("playback-screen-text");

            if (isDictationEnabled) {
                screenText.textContent = '👂';

                screenText.className = "text-center text-7xl font-semibold text-gray-800 leading-relaxed my-auto px-4";
            }
            else {
                screenText.textContent = activePlaybackArray[playbackIndex];

                if (activePlaybackArray[playbackIndex].length <= 2) {
                    screenText.className = "text-center text-5xl font-bold text-gray-800 leading-relaxed my-auto px-4";
                } else {
                    screenText.className = "text-center text-2xl font-semibold text-gray-800 leading-relaxed my-auto px-4";
                }
            }
            
            
            document.getElementById("status-bar").textContent = `Currently Viewing: ${activeList.name}`;
            
            const activeProfile = chosenVoiceMapping[activeList.lang];
            const nameDisplay = activeProfile ? activeProfile.name : "Default System Voice";
            document.getElementById("playback-lang-indicator").textContent = `Hardware Voice locked onto: ${nameDisplay}`;
        }

        function resetPlayerUI() {
            activeList = null; activePlaybackArray = []; playbackIndex = 0;
            isShuffleEnabled = false;
            syncShuffleButtonUI();
            document.getElementById("playback-index-counter").textContent = "Item 0 of 0";
            document.getElementById("playback-screen-text").textContent = "Select a list from Library to begin.";
            document.getElementById("playback-screen-text").className = "text-center text-2xl font-semibold text-gray-800 leading-relaxed my-auto px-4";
            document.getElementById("status-bar").textContent = "Select or create a list to begin";
            document.getElementById("playback-lang-indicator").textContent = "Voice Engine: None";
        }

        function renderSidebarDOMComponents() {
            const listContainer = document.getElementById("groups-list-container");
            const selectDropdown = document.getElementById("group-target-select");
            
            listContainer.innerHTML = "";
            selectDropdown.innerHTML = '<option value="">Select a Group...</option>';

            dbState.forEach(group => {
                const opt = document.createElement("option");
                opt.value = group.id; opt.textContent = group.name;
                selectDropdown.appendChild(opt);

                const groupSection = document.createElement("div");
                groupSection.className = "space-y-1";
                groupSection.innerHTML = `<div class="text-sm font-bold text-gray-700 bg-gray-100 px-2 py-1 rounded flex justify-between items-center"><span class="truncate">${group.name}</span></div>`;
                
                const subListContainer = document.createElement("div");
                subListContainer.className = "pl-3 space-y-0.5 border-l border-gray-200 ml-2 mt-1";

                if (group.subLists.length === 0) {
                    subListContainer.innerHTML = '<div class="text-xs text-gray-400 italic py-1">No lists inside group</div>';
                } else {
                    group.subLists.forEach(sub => {
                        const langBadge = sub.lang === 'zh' ? '粤' : 'UK';
                        const isCurrentActive = activeList && activeList.id === sub.id;
                        const row = document.createElement("div");
                        row.onclick = () => selectActiveList(sub.id);
                        row.className = `flex justify-between items-center text-sm px-2 py-1.5 rounded-lg cursor-pointer transition ${isCurrentActive ? 'bg-blue-50 text-blue-600 font-medium' : 'text-gray-600 hover:bg-gray-50'}`;
                        row.innerHTML = `
                            <span class="truncate flex items-center">
                                └
                                <span class="text-[10px] px-1 py-0.5 rounded bg-gray-200 text-gray-700 font-bold mr-1.5">${langBadge}</span>
                                ${sub.name}
                            </span>
                            <button onclick="deleteListFromDB(${sub.id}, event)" class="text-gray-400 hover:text-red-500 p-0.5"><!--i class="fa-regular fa-trash-can text-xs"></i-->🗑</button>
                        `;
                        subListContainer.appendChild(row);
                    });
                }
                groupSection.appendChild(subListContainer);
                listContainer.appendChild(groupSection);
            });
        }
    </script>
    <script>
      function debugVoices() {
        const voices = window.speechSynthesis.getVoices();
        if (voices.length === 0) return;

        // Filter to find any voice related to Hong Kong, Chinese, or Cantonese
        const targetVoices = voices.filter(v => 
          v.lang.toLowerCase().includes('zh') || 
          v.lang.toLowerCase().includes('yu') || 
          v.lang.toLowerCase().includes('hk')
        );

        if (targetVoices.length === 0) {
          alert("No Chinese/Cantonese voices found. Total system voices found: " + voices.length);
          return;
        }

        // Format the list to show Name and Language Code
        const voiceListText = targetVoices.map(v => `${v.name} (${v.lang})`).join('\n');
        alert("Found Chinese/Cantonese Voices:\n" + voiceListText);
      }

      // Execute and listen for WebKit's delayed loading
      //window.speechSynthesis.onvoiceschanged = debugVoices;
      //debugVoices();
    </script>
    <script>
        // Opens the modal and populates it with the current displayed text
        function openAmendModal() {

          const screenTextElement = document.getElementById('playback-screen-text');
          const textInput = document.getElementById('amend-text-input');
          const dialog = document.getElementById('amend-dialog');
          
          // Guard clause to prevent editing the default start instruction screen
          //if (activePlaybackArray.length === 0 || !activeList || typeof speechSynthesis === 'undefined')
          if (!activeList || activePlaybackArray.length === 0) {
            alert("Please select and start a valid data stream list before editing.");
            return;
          }
          
          // Fetch current active item string directly from data storage
          textInput.value = activePlaybackArray[playbackIndex];
          dialog.showModal();
        }

        // Closes the modal without doing anything
        function closeAmendModal() {
          document.getElementById('amend-dialog').close();
        }

        // Commits the modified text to the application and interface
        function commitAmendText() {
          const newValue = document.getElementById('amend-text-input').value.trim();
          
          if (newValue === "") {
            alert("Text element content cannot be empty.");
            return;
          }
          
          // 1. Update text content in your running sequence array
          activePlaybackArray[playbackIndex] = newValue;
          
          // 2. Refresh UI playback board display immediately
          document.getElementById('playback-screen-text').innerText = newValue;
          
          // 3. Optional: Add your custom IndexedDB update block here if modifications need persistence across page refreshes
          
          closeAmendModal();
        }

        // Returns the true decimal speed value for your text-to-speech execution engine
        function getSelectedSpeechRate() {
            const sliderValue = document.getElementById('speech-speed-slider')?.value || 2;
            return speedMap[sliderValue].rate;
        }

        // Updates the small text indicator label when sliding across options
        function updateSpeechSpeedDisplay() {
            const sliderValue = document.getElementById('speech-speed-slider').value;
            const label = document.getElementById('speed-label-text');
            label.innerText = speedMap[sliderValue].label;
        }
    </script>
